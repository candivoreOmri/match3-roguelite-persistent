# docs/*.html are GENERATED passphrase-gated builds: the page body is an
# AES-256 ciphertext blob (base64), regenerated with a fresh salt on every
# rebuild. Random base64 occasionally matches credential patterns (e.g. the
# 2026-09-01 'Tencent token' false positive, alert #1). Nothing in these
# files is a real secret — the actual passphrase is deliberately NOT in this
# repo (build.sh takes M3_PASSPHRASE from the environment).
paths-ignore:
  - "docs/**/*.html"
